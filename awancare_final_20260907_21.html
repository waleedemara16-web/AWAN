  <title>أوان لرعاية ذوي الاحتياجات الخاصة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:ital,wght@0,600;0,800;0,900;1,700&family=Tajawal:wght@400;500;700&family=Poppins:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap');
    :root {
      --navy:#06474D; --navy-2:#12707A; --blue:#9989B1; --teal:#F5795F;
      --teal-2:#FCEAE3; --gold:#ECAE4A; --gold-2:#FBF0DC; --ink:#20302E;
      --muted:#6E7D79; --bg:#FCF8F2; --card:#fff; --line:#E9E1D2;
      --danger:#dc2626; --danger-2:#fef2f2;
      --shadow:0 14px 34px rgba(6,71,77,.10);
      --shadow-sm:0 6px 16px rgba(6,71,77,.07);
      --shadow-lg:0 26px 60px rgba(6,71,77,.14);
      --radius:18px; --cream:#FCF8F2; --cream-2:#F3ECDD; --teal-light:#F7B49B;
      --coral:#F5795F; --purple:#9989B1; --sage:#629386; --mustard:#ECAE4A; --ease:cubic-bezier(.22,.9,.32,1);
    }
    [data-theme="dark"]{
      --bg:#0E1B1A; --card:#16302E; --ink:#E8EDE9; --muted:#93A6A0; --line:#254743;
      --cream:#16302E; --cream-2:#1B3733; --teal-2:rgba(245,121,95,.16); --gold-2:rgba(236,174,74,.16);
      --danger-2:rgba(220,38,38,.16);
      --shadow:0 14px 34px rgba(0,0,0,.4); --shadow-sm:0 6px 16px rgba(0,0,0,.3); --shadow-lg:0 26px 60px rgba(0,0,0,.5);
    }
    [data-theme="dark"] .list-row{background:#132523}
    [data-theme="dark"] .input,[data-theme="dark"] .select,[data-theme="dark"] .textarea{background:#132523;color:var(--ink);border-color:var(--line)}
    [data-theme="dark"] .notice-blue{background:rgba(56,142,110,.15);border-color:rgba(56,142,110,.35);color:#BFE3D2}
    [data-theme="dark"] .data-table tbody tr:hover{background:#132523}
    [data-theme="dark"] .box-card,[data-theme="dark"] .dept-supervisor-card{background:rgba(255,255,255,.05)}
    [data-theme="dark"] .dept-member-avatar,[data-theme="dark"] .dept-supervisor-avatar{background:rgba(255,255,255,.08)}
    [data-theme="dark"] code{background:#132523 !important;color:var(--ink)}
    [data-theme="dark"] .section-card{background:var(--card)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Tajawal","Cairo","Nunito","Poppins","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    body{line-height:1.65}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}

    function load(){
      try {
        const saved=JSON.parse(localStorage.getItem(KEY)||"null");
        const merged = saved ? merge(seed,saved) : clone(seed);
        migrateLegacyFacilities(merged);
        migrateStaffCodes(merged);
        // "تذكرني" was unchecked at login -> the session shouldn't survive a fresh page load
        if(merged.facilitySession && !merged.facilitySession.remember){
          merged.facilitySession=null;
          merged.facilityTab="select";
        }
        return merged;
      }
      catch(e){ return clone(seed); }
    }
    // Ensures every staff member has a login code/id/roleCategory even if this
    // browser's saved data predates the staff login-code feature.
    function migrateStaffCodes(st){
      if(!Array.isArray(st.staff)) { st.staff=clone(seed.staff); }
      const usedCodes={};
      st.staff.forEach((s,i)=>{
        if(!s||typeof s!=="object") return;
        if(!s.id) s.id="st-legacy-"+i+"-"+Date.now();
        if(!s.roleCategory) s.roleCategory="staff";
        if(s.clinical===undefined) s.clinical = s.roleCategory==="staff"||s.roleCategory==="supervisor";
        if(s.department===undefined) s.department=null;
        if(!s.code || usedCodes[s.code]){
          const clean=(s.name||"").replace(/^(د\.|أ\.)\s*/,"").trim();
          const letter=clean.charAt(0)||"م";
          let n=1; while(usedCodes[letter+n]) n++;
          s.code=letter+n;
        }
        usedCodes[s.code]=true;
      });
      if(!Array.isArray(st.evaluations)) st.evaluations=clone(seed.evaluations||[]);
      if(!Array.isArray(st.dailyTasks)) st.dailyTasks=clone(seed.dailyTasks||[]);
      if(!Array.isArray(st.workshops)) st.workshops=clone(seed.workshops||[]);
      if(!Array.isArray(st.complaints)) st.complaints=clone(seed.complaints||[]);
      if(!Array.isArray(st.courses)) st.courses=clone(seed.courses||[]);
      if(!Array.isArray(st.plans)) st.plans=clone(seed.plans||[]);
      if(!Array.isArray(st.qualityAudits)) st.qualityAudits=clone(seed.qualityAudits||[]);
      if(!Array.isArray(st.messages)) st.messages=clone(seed.messages||[]);
      if(st.currentStaffId===undefined) st.currentStaffId=null;
      if(st.staffSection===undefined) st.staffSection=null;
      if(!st.staffScheduleFilter) st.staffScheduleFilter="all";
      if(!Array.isArray(st.consultationReviews)) st.consultationReviews=clone(seed.consultationReviews||[]);
      if(!Array.isArray(st.invoices)) st.invoices=clone(seed.invoices||[]);
      if(!Array.isArray(st.packagePurchases)) st.packagePurchases=clone(seed.packagePurchases||[]);
      st.packagePurchases.forEach(pp=>{
        if(pp.sessionsTotal===undefined) pp.sessionsTotal=pp.sessions||0;
        if(pp.sessionsUsed===undefined) pp.sessionsUsed=0;
        if(pp.patientId===undefined){const match=st.patients.find(p=>p.name===pp.patientName);pp.patientId=match?match.id:null;}
      });
    }
    // Repairs facility records saved by older versions of this app that
    // predate the "id" field (or that are otherwise malformed), so stale
    // data left over from a previous version can never crash the app.
    function migrateLegacyFacilities(st){
      if(!Array.isArray(st.facilities)) { st.facilities=clone(seed.facilities); return }
      const seenIds={};
      st.facilities.forEach((f,i)=>{
        if(!f || typeof f!=="object") return;
        if(typeof f.id!=="string" || !f.id) f.id="legacy-"+i+"-"+Date.now();
        while(seenIds[f.id]){ f.id=f.id+"-"+i }
        seenIds[f.id]=true;
        if(!Array.isArray(f.services)) f.services=["خدمات علاجية وتأهيلية","إدارة مواعيد ومتابعة"];
        if(!f.icon) f.icon="briefcase";
        if(!f.code) f.code="ORG-"+Math.floor(1000+Math.random()*9000);
        if(!f.username) f.username="team-"+f.id;
        if(!f.password) f.password="1234";
      });
    }

    function svgBarChart(data,opts={}){
      const w=opts.width||520,h=opts.height||190,pad=30;
      const max=Math.max(1,...data.map(d=>d.value));
      const gap=(w-pad*2)/Math.max(data.length,1);
      const barW=Math.min(38,gap*0.56);
      const color=opts.color||"var(--teal)";
      const bars=data.map((d,i)=>{
        const bh=Math.round((d.value/max)*(h-pad*2-14));
        const x=pad+i*gap+(gap-barW)/2;
        const y=h-pad-bh;
        return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(bh,2)}" rx="6" fill="${color}"></rect><text x="${x+barW/2}" y="${h-pad+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(d.label)}</text><text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--navy)">${d.value}</text>`;
      }).join("");
      return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;max-width:${w}px" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
    }
    function svgDonutChart(data,opts={}){
      const size=opts.size||150,stroke=opts.stroke||20,r=(size-stroke)/2,cx=size/2,cy=size/2;
      const total=data.reduce((s,d)=>s+d.value,0);
      const circumference=2*Math.PI*r;
      if(!total) return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"></circle></svg>`;
      let offset=0;
      const segs=data.filter(d=>d.value>0).map(d=>{
        const frac=d.value/total;
        const dash=frac*circumference;
        const seg=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"></circle>`;
        offset+=dash;
        return seg;
      }).join("");
      return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">${segs}</svg>`;
    }

        if(!patient){notify("تعذر إيجاد ملف الطفل المحدد");return}
      }
      const specialist=state.staff.find(s=>s.name===f.clinician);
      const amount=Number(f.amount)||0;
      let payFromPackage=false;
      let paymentLabel=f.payment;
      if(f.payment==="من الباقة"){
        const activePkg=state.packagePurchases.find(pp=>pp.patientId===patient.id&&(pp.sessionsTotal-pp.sessionsUsed)>0);
        if(!activePkg){notify("لا يوجد رصيد باقة متاح لهذا الطفل — اختاري طريقة دفع أخرى");return}
        activePkg.sessionsUsed=(activePkg.sessionsUsed||0)+1;
        payFromPackage=true;
        paymentLabel="من الباقة — "+activePkg.package;
      }
      const isConsultation=f.bookingType==="استشارة مبدئية";
      if(isConsultation){
        state.consultationReviews.unshift({id:"cv-"+Date.now(),patientId:patient.id,patientName:patient.name,department:specialist?specialist.department:null,specialistName:f.clinician,date:f.date,time:f.time,room:f.room,guardian:patient.guardian,phone:patient.phone,status:"بانتظار المراجعة",note:""});
      }
      state.appointments.push({id:"apt-"+Date.now(),date:f.date,time:f.time,patient:patient.name,service:f.service,clinician:f.clinician,room:f.room,status:"مجدول",bookingType:f.bookingType,newForStaff:true});
      if(payFromPackage){
        createInvoice({patientId:patient.id,patientName:patient.name,type:"من الباقة",label:f.service,amount:0,payment:paymentLabel});
      } else if(amount>0){
        createInvoice({patientId:patient.id,patientName:patient.name,type:isConsultation?"استشارة":(f.bookingType==="جلسة تعويضية"?"جلسة تعويضية":"جلسة منفردة"),label:f.service,amount,payment:f.payment});
      }
      persist();closeModal();
      notify(isConsultation?`تم تسجيل الاستشارة وترحيلها للإشراف الفني للمراجعة قبل اعتماد جدول ثابت لـ ${patient.name}`:`تم تسجيل الحجز لـ ${patient.name} بنجاح`);
      render();
    }

    function reportsView(){
      const totalAppts=state.appointments.length;
      const completed=state.appointments.filter(a=>a.status==="مكتمل").length;
      const scheduled=state.appointments.filter(a=>a.status==="مجدول").length;
      const byClinician={};
      state.appointments.forEach(a=>{byClinician[a.clinician]=(byClinician[a.clinician]||0)+1});
      const byDept={};
      state.staff.forEach(s=>{if(s.department){const n=state.appointments.filter(a=>a.clinician===s.name).length;byDept[s.department]=(byDept[s.department]||0)+n}});
      const activePatients=state.patients.filter(p=>!p.archived).length;
      const pendingReferrals=state.referrals.filter(r=>r.status==="جديدة"||r.status==="قيد الفرز").length;
      const todayStr=todayISO();
      const monthPrefix=todayStr.slice(0,7);
      const paidInvoices=state.invoices.filter(inv=>inv.paid);
      const dailyRevenue=paidInvoices.filter(inv=>inv.date===todayStr).reduce((s,i)=>s+i.amount,0);
      const monthlyRevenue=paidInvoices.filter(inv=>(inv.date||"").startsWith(monthPrefix)).reduce((s,i)=>s+i.amount,0);
      const byType={};
      paidInvoices.forEach(inv=>{byType[inv.type]=(byType[inv.type]||0)+inv.amount});
      const typePalette=["var(--teal)","var(--gold)","var(--sage)","var(--purple)","var(--navy-2)"];
      const typeChartData=Object.entries(byType).map(([type,amt],i)=>({label:type,value:amt,color:typePalette[i%typePalette.length]}));
      const receivables=state.invoices.filter(inv=>!inv.paid);
      const receivablesTotal=receivables.reduce((s,i)=>s+i.amount,0);
      const deptPalette=["var(--teal)","var(--gold)","var(--sage)","var(--purple)","var(--navy-2)","#E4A6C5","#7FB3D5","#C9A66B"];
      const deptChartData=Object.entries(byDept).map(([dept,n],i)=>({label:departmentLabel(dept),value:n,color:deptPalette[i%deptPalette.length]}));
      return head("التقارير / 08","تقارير الأداء العامة","نظرة عامة سريعة على أداء المركز — للاطّلاع، بدون الحاجة لتصدير خارجي.","")
      +`<section class="metric-grid">${metric("schedule","إجمالي المواعيد",totalAppts,"كل المواعيد المسجلة")}${metric("check","جلسات مكتملة",completed,scheduled+" مجدولة")}${metric("referrals","إحالات بانتظار المراجعة",pendingReferrals,"تحتاج إجراء","gold")}${metric("patients","ملفات نشطة",activePatients,"من إجمالي "+state.patients.length)}</section>`
      +(deptChartData.length?`<section class="card"><div class="card-head"><h2>توزيع المواعيد على الأقسام</h2><span class="muted">رسم بياني تفاعلي</span></div><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div>${svgDonutChart(deptChartData)}</div><div style="flex:1;min-width:180px">${chartLegend(deptChartData)}</div></div></section>`:"")
      +`<div class="grid-2" style="margin-top:18px"><section class="card"><div class="card-head"><h2>المواعيد حسب المعالج</h2></div><div class="list">${Object.keys(byClinician).length?Object.entries(byClinician).sort((a,b)=>b[1]-a[1]).map(([name,n])=>`<div class="list-row"><div class="list-main"><strong>${esc(name)}</strong></div><div class="list-end"><b>${n}</b></div></div>`).join(""):`<div class="empty">لا توجد بيانات كافية.</div>`}</div></section><section class="card"><div class="card-head"><h2>المواعيد حسب القسم</h2></div><div class="list">${Object.keys(byDept).length?Object.entries(byDept).map(([dept,n])=>`<div class="list-row"><div class="list-main"><strong>${esc(departmentLabel(dept))}</strong></div><div class="list-end"><b>${n}</b></div></div>`).join(""):`<div class="empty">لا توجد بيانات كافية.</div>`}</div></section></div>`
      +`<section class="card" style="margin-top:18px"><div class="card-head"><h2>التقارير المالية</h2><span class="muted">مرحّلة تلقائياً من الاستقبال وبوابة الأسرة</span></div><section class="metric-grid">${metric("idcard","إيرادات اليوم",dailyRevenue+" ر.س","محصّلة فعلياً")}${metric("chart","إيرادات الشهر",monthlyRevenue+" ر.س","إجمالي الشهر الحالي")}${metric("referrals","ذمم مستحقة",receivablesTotal+" ر.س",receivables.length+" فاتورة آجلة","gold")}</section>
        <div class="grid-2" style="margin-top:16px"><div><div class="card-head"><h2>الإيرادات حسب النوع</h2></div>${typeChartData.length?`<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">${svgDonutChart(typeChartData,{size:110,stroke:16})}${chartLegend(typeChartData)}</div>`:""}<div class="list">${Object.keys(byType).length?Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,amt])=>`<div class="list-row"><div class="list-main"><strong>${esc(type)}</strong></div><div class="list-end"><b>${amt} ر.س</b></div></div>`).join(""):`<div class="empty">لا توجد بيانات مالية كافية.</div>`}</div></div>
        <div><div class="card-head"><h2>الذمم — مبالغ متبقية على أولياء الأمور</h2></div><div class="list">${receivables.length?receivables.map(r=>`<div class="list-row"><div class="list-main"><strong>${esc(r.patientName||"زائر")}</strong><small>${esc(r.type)} · ${esc(r.label)} · ${date(r.date)}</small></div><div class="list-end"><b style="color:var(--danger)">${r.amount} ر.س</b></div></div>`).join(""):`<div class="empty">لا توجد ذمم مستحقة حالياً 🌿</div>`}</div></div></div>
      </section>`;
    }
    const LICENSE_STATUSES=["لم يبدأ","قيد المراجعة","مكتملة"];
    function municipalLicense(){
      const ml=state.municipalLicense;
      const total=ml.steps.length;
      const done=ml.steps.filter(s=>s.status==="مكتملة").length;
      const readiness=total?Math.round((done/total)*100):0;
      const editBtn=`<button class="btn btn-primary" onclick="openModal('licenseInfo')">تعديل بيانات الطلب</button>`;
      const stepBoxes=ml.steps.map(s=>`<div class="box-card"><div class="box-card-head"><h4>${esc(s.label)}</h4>${pill(s.status)}</div><div style="display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap"><select class="select" style="padding:6px;font-size:11px" onchange="updateLicenseStepStatus('${s.id}',this.value)">${LICENSE_STATUSES.map(st=>`<option value="${st}" ${s.status===st?"selected":""}>${st}</option>`).join("")}</select><button class="btn btn-outline" style="padding:6px 10px;font-size:11px;color:var(--danger)" onclick="removeLicenseStep('${s.id}')">حذف</button></div></div>`).join("");
      return head("الترخيص البلدي","متابعة ترخيص بلدية جدة","تتبّع خطوات ومتطلبات ترخيص المركز لدى الجهة البلدية المختصة، أوّلاً بأول.",editBtn)
      +`<section class="metric-grid" style="grid-template-columns:repeat(3,1fr)">${metric("idcard","رقم الطلب البلدي",ml.requestNumber||"—","الرقم المرجعي للطلب")}${metric("briefcase","الجهة التابعة",ml.authority||"—","الجهة المسؤولة عن الترخيص")}${metric("check","مستوى الجاهزية",readiness+"%",`${done} من ${total} خطوة مكتملة`,readiness===100?undefined:"gold")}</section>`
      +`<section class="card"><div class="card-head"><h2>خطوات ومراحل الإصدار</h2><button class="btn btn-outline" onclick="openModal('licenseStep')">＋ إضافة خطوة</button></div>${total?`<div class="box-grid">${stepBoxes}</div>`:`<div class="empty">لا توجد خطوات مضافة بعد.</div>`}</section>`
      +`<section class="card" style="margin-top:16px"><div class="card-head"><h2>ملاحظات</h2></div><form onsubmit="saveLicenseNotes(event)"><textarea class="textarea" name="notes" rows="4" placeholder="أي متابعات أو ملاحظات خاصة بالترخيص...">${esc(ml.notes||"")}</textarea><div class="actions" style="margin-top:12px"><button class="btn btn-primary">حفظ الملاحظات</button></div></form></section>`;
    }
    function updateLicenseStepStatus(id,status){const s=state.municipalLicense.steps.find(x=>x.id===id);if(!s)return;s.status=status;persist();notify("تم تحديث حالة الخطوة");render()}
    function removeLicenseStep(id){state.municipalLicense.steps=state.municipalLicense.steps.filter(x=>x.id!==id);persist();notify("تم حذف الخطوة");render()}
    function addLicenseStep(e){e.preventDefault();const f=formData(e);state.municipalLicense.steps.push({id:"ml-"+Date.now(),label:f.label,status:"لم يبدأ"});persist();closeModal();notify("تمت إضافة الخطوة");render()}
    function saveLicenseInfo(e){e.preventDefault();const f=formData(e);state.municipalLicense.requestNumber=f.requestNumber;state.municipalLicense.authority=f.authority;persist();closeModal();notify("تم حفظ بيانات الطلب");render()}
    function saveLicenseNotes(e){e.preventDefault();const f=formData(e);state.municipalLicense.notes=f.notes;persist();notify("تم حفظ الملاحظات")}
    function departments(){
      if(state.openDept){return departmentDetail(state.openDept)}
      const addBtn=can('editDepartments')?"<button class=\"btn btn-primary\" onclick=\"openModal('department')\">＋ إضافة قسم</button>":"";
      const permNote=can('editDepartments')?"":`<div class="notice" style="margin-bottom:18px">العرض هنا للاطّلاع فقط. تعديل الأقسام وإضافتها متاح حصراً من لوحة الإدارة، ما لم تُمنح صلاحية إضافية من هناك.</div>`;
      return head("الأقسام / الخدمات","الأقسام والخدمات","مساحة عمل موحدة للأقسام العلاجية والتعليمية، مع حالة جاهزية كل خدمة.",addBtn)+permNote+`<div class="notice-blue" style="margin-bottom:18px">يمكن تخصيص الصلاحيات حسب الدور: الإشراف يرى كل الأقسام، الإدارة تتابع المؤشرات، الموظف يرى خدماته، والاستقبال يرى الخدمات المتاحة للحجز.</div><section class="section-grid">${state.departments.map(d=>`<article class="section-card"><div class="section-icon">${ic(d.icon,22)}</div><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p><div style="margin-bottom:10px">${pill(d.state)}</div><small style="display:block;color:var(--muted);font-size:10px">${esc(d.services)}</small><button class="btn btn-outline" style="width:100%;margin-top:14px" onclick="openDepartmentDetail('${d.id}')">فتح القسم</button></article>`).join("")}</section>`;
    }
    function openDepartmentDetail(id){state.openDept=id;render()}
    function closeDepartmentDetail(){state.openDept=null;render()}
    function departmentDetail(id){
      const d=state.departments.find(x=>x.id===id);
      if(!d){state.openDept=null;return departments()}
      const services=(d.services||"").split("·").map(s=>s.trim()).filter(Boolean);
      const editBtn=can('editDepartments')?`<button class="btn btn-primary" onclick="openModal('editDepartment','${d.id}')">تعديل بيانات القسم</button>`:"";
      const person=getCurrentPerson();
      const deptStaff=state.staff.filter(s=>s.department===d.id);
      const supervisor=deptStaff.find(s=>s.roleCategory==="supervisor");
      const team=deptStaff.filter(s=>s.roleCategory==="staff");
      const deptStaffIds=deptStaff.map(s=>s.id);
      const deptStaffNames=deptStaff.map(s=>s.name);
      const deptAppts=state.appointments.filter(a=>deptStaffNames.includes(a.clinician));
      const completedAppts=deptAppts.filter(a=>a.status==="مكتمل");
      const patientNames=[...new Set(deptAppts.map(a=>a.patient))];
      const deptPatients=patientNames.map(n=>state.patients.find(p=>p.name===n)).filter(Boolean);
      const deptEvaluations=state.evaluations.filter(e=>deptStaffIds.includes(e.staffId));
      const deptPlans=state.plans.filter(p=>p.department===d.id);
      const deptAudits=state.qualityAudits.filter(a=>a.department===d.id);
      const isDeptSupervisor=!!(person&&supervisor&&person.id===supervisor.id);
      const isDeptStaffMember=!!(person&&team.some(s=>s.id===person.id));
      const isOtherSupervisor=!!(person&&person.roleCategory==="supervisor"&&person.department!==d.id);

      const canAssignSupervisor=can('editDepartments');
      const canAddMember=can('editDepartments')||isDeptSupervisor;
      const assignSupervisorBtn=canAssignSupervisor?`<button class="btn btn-primary" style="padding:8px 14px;font-size:12px" onclick="openModal('staff','${d.id}::supervisor')">${ic("check",13)} ${supervisor?"تغيير المشرف/ة":"تعيين مشرف/ة"}</button>`:"";
      const addMemberBtn=canAddMember?`<button class="btn btn-outline" style="padding:8px 14px;font-size:12px" onclick="openModal('staff','${d.id}::staff')">＋ إضافة عضو للفريق</button>`:"";
      const supervisorBlock=supervisor?`<div class="dept-supervisor-card"><div style="display:flex;align-items:center;gap:14px"><span class="dept-supervisor-avatar">${ic("eye",24)}</span><div><span class="pill pill-gold" style="margin-bottom:6px;display:inline-block">مشرف/ة القسم</span><br><strong style="font-size:17px">${esc(supervisor.name)}</strong><br><small style="color:var(--muted)">${esc(supervisor.role)}${supervisor.code?" · كود: "+esc(supervisor.code):""}</small></div></div>${pill(supervisor.status)}</div>`:`<div class="dept-supervisor-card" style="justify-content:center;text-align:center"><small style="color:var(--muted);font-size:13px">لم يتم تعيين مشرف/ة لهذا القسم بعد.</small></div>`;
      const memberBoxes=team.length?team.map(s=>`<div class="box-card" style="display:flex;align-items:center;gap:12px"><span class="dept-member-avatar">${ic("team",17)}</span><div style="min-width:0;flex:1"><strong style="display:block;font-size:13px">${esc(s.name)}</strong><small>${esc(s.role)}</small></div>${pill(s.status)}</div>`).join(""):`<div class="empty">لا يوجد أخصائيون في هذا القسم بعد.</div>`;
      const teamCard=`<section class="card" style="margin-top:16px"><div class="card-head"><h2>المشرف والفريق</h2><div class="dept-actions-row">${assignSupervisorBtn}${addMemberBtn}</div></div>${supervisorBlock}<div class="box-grid">${memberBoxes}</div></section>`;

      const teamThread=state.messages.filter(m=>deptStaffIds.includes(m.fromId)&&deptStaffIds.includes(m.toId)).slice(0,10);
      let teamRecipients=[];
      if(isDeptSupervisor) teamRecipients=team;
      else if(isDeptStaffMember&&supervisor) teamRecipients=[supervisor];
      const teamMsgForm=teamRecipients.length?`<form onsubmit="sendInternalMessage(event)" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px"><div class="field" style="min-width:180px;margin:0"><label>إلى</label><select class="select" name="to">${teamRecipients.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select></div><div class="field" style="flex:1;min-width:200px;margin:0"><label>الرسالة</label><input class="input" name="text" required placeholder="اكتب رسالتك هنا"></div><button class="btn btn-primary" type="submit">إرسال</button></form>`:`<div class="notice" style="margin-bottom:14px">${person?"هذه القناة مخصصة لمشرف/ة القسم وأعضاء فريقه — سجّلي الدخول بكودك الشخصي إذا كنتِ من ضمنهم.":"سجّلي الدخول بكودك الشخصي لإرسال رسائل داخل القسم."}</div>`;
      const teamMsgCard=`<section class="card" style="margin-top:16px"><div class="card-head"><h2>${ic("chat",18)} تواصل المشرف مع فريق القسم</h2><span class="muted">قناة داخلية بين مشرف/ة القسم وأعضاء فريقه</span></div>${teamMsgForm}<div class="list">${teamThread.length?teamThread.map(m=>`<div class="list-row" style="align-items:flex-start"><div class="list-main"><strong>${esc(m.fromName)} ← ${esc(m.toName)}</strong><small>${esc(m.text)}</small></div><div class="list-end">${date(m.date)}</div></div>`).join(""):`<div class="empty">لا توجد رسائل بعد داخل هذا القسم.</div>`}</div></section>`;

      const allSupervisors=state.staff.filter(s=>s.roleCategory==="supervisor");
      const otherSupervisors=allSupervisors.filter(s=>s.department!==d.id);
      let crossRecipients=[];
      if(isDeptSupervisor) crossRecipients=otherSupervisors;
      else if(isOtherSupervisor&&supervisor) crossRecipients=[supervisor];
      const supervisorIds=allSupervisors.map(s=>s.id);
      const crossThread=supervisor?state.messages.filter(m=>supervisorIds.includes(m.fromId)&&supervisorIds.includes(m.toId)&&(m.fromId===supervisor.id||m.toId===supervisor.id)).slice(0,10):[];
      const crossMsgForm=crossRecipients.length?`<form onsubmit="sendInternalMessage(event)" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px"><div class="field" style="min-width:200px;margin:0"><label>إلى</label><select class="select" name="to">${crossRecipients.map(r=>`<option value="${r.id}">${esc(r.name)} — ${esc(departmentLabel(r.department))}</option>`).join("")}</select></div><div class="field" style="flex:1;min-width:200px;margin:0"><label>الرسالة</label><input class="input" name="text" required placeholder="نسّقي مع مشرف/ة القسم الآخر هنا"></div><button class="btn btn-primary" type="submit">إرسال</button></form>`:`<div class="notice" style="margin-bottom:14px">${!supervisor?"لا يمكن التنسيق مع هذا القسم قبل تعيين مشرف/ة له.":"هذه القناة مخصصة للتواصل بين مشرفي/ات الأقسام المختلفة."}</div>`;
      const crossMsgCard=`<section class="card" style="margin-top:16px"><div class="card-head"><h2>${ic("chat",18)} تواصل مشرفي الأقسام</h2><span class="muted">لربط ${esc(d.name)} ببقية أقسام المركز</span></div>${crossMsgForm}<div class="list">${crossThread.length?crossThread.map(m=>`<div class="list-row" style="align-items:flex-start"><div class="list-main"><strong>${esc(m.fromName)} ← ${esc(m.toName)}</strong><small>${esc(m.text)}</small></div><div class="list-end">${date(m.date)}</div></div>`).join(""):`<div class="empty">لا توجد رسائل بعد بين مشرفي الأقسام حول ${esc(d.name)}.</div>`}</div></section>`;

      const assessBoxes=deptEvaluations.map(e=>{const s=personById(e.staffId);return `<div class="box-card"><div class="box-card-head"><h4>${esc(e.patient)}</h4>${pill(e.status)}</div><small>${esc(e.type)}</small><small>${s?esc(s.name):"—"} · ${date(e.date)}</small></div>`}).join("");
      const assessCard=`<section class="card" style="margin-top:16px"><div class="card-head"><h2>${ic("eye",18)} التقييمات</h2><span class="muted">${deptEvaluations.length} تقييم</span></div>${deptEvaluations.length?`<div class="box-grid">${assessBoxes}</div>`:`<div class="empty">لا توجد تقييمات مسجّلة لهذا القسم بعد.</div>`}</section>`;

      const progBoxes=deptPatients.map(p=>`<div class="box-card"><div class="box-card-head"><h4>${esc(p.name)}</h4>${pill(p.status)}</div><small>${esc(p.program)}</small><small>هدف الأسبوع: ${esc(p.goal)}</small></div>`).join("");
      const progCard=`<section class="card" style="margin-top:16px"><div class="card-head"><h2>${ic("target",18)} البرامج العلاجية للمستفيدين</h2><span class="muted">${deptPatients.length} حالة نشطة</span></div>${deptPatients.length?`<div class="box-grid">${progBoxes}</div>`:`<div class="empty">لا توجد حالات مرتبطة بهذا القسم حالياً.</div>`}</section>`;

      const reportCard=`<section class="card" style="margin-top:16px"><div class="card-head"><h2>${ic("chart",18)} تقارير القسم</h2><span class="muted">نظرة سريعة على أداء ${esc(d.name)}</span></div><section class="metric-grid">${metric("check","جلسات مكتملة",completedAppts.length,`من ${deptAppts.length} موعد`)}${metric("patients","حالات مرتبطة",deptPatients.length,"مستفيد/ة")}${metric("eye","تقييمات",deptEvaluations.length,"مسجّلة")}${metric("book","خطط علاجية",deptPlans.length,"بكل الحالات")}</section></section>`;

    function setupScrollReveal(){
      const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if(reduceMotion) return;
      const app=document.getElementById("app");
      if(!app) return;
      const els=app.querySelectorAll(".section-card, .portal-card, .value-card, .metric, .role-card, .landing-trustbar, .landing-footer");
      if(!els.length) return;
      const groups=new Map();
      els.forEach(el=>{
        const p=el.parentElement;
        if(!groups.has(p)) groups.set(p,[]);
        groups.get(p).push(el);
      });
      groups.forEach(list=>{
        list.forEach((el,i)=>{
          el.classList.add("reveal-on-scroll");
          el.style.transitionDelay=Math.min(i*70,420)+"ms";
        });
      });
      if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("is-visible")); return }
      const io=new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add("is-visible");
            io.unobserve(entry.target);
          }
        });
      },{threshold:0.12,rootMargin:"0px 0px -30px 0px"});
      els.forEach(el=>io.observe(el));
    }

    function aptPhoneFor(name){const p=state.patients.find(x=>x.name===name);return p?p.phone||"":""}
    function formData(e){return Object.fromEntries(new FormData(e.target).entries())}
    function composeProgressReportText(patient,staff,data){
      const levelPhrase={"ممتاز":"تقدمًا ملحوظًا ومتسارعًا","جيد جدًا":"تقدمًا جيدًا جدًا وثباتًا واضحًا في الأداء","جيد":"تقدمًا جيدًا ومقبولًا خلال هذه الفترة","يحتاج دعمًا إضافيًا":"تقدمًا أبطأ من المتوقع ويحتاج دعمًا إضافيًا وتكثيفًا في التمارين المنزلية"}[data.level]||"تقدمًا ملموسًا";
      const opener=`تقرير متابعة تقدم — ${patient.name}\nالتاريخ: ${date(data.date)} · البرنامج: ${patient.program||"—"}`;
      const body=`أظهر/ت ${patient.name} خلال هذه الفترة ${levelPhrase}، وذلك في إطار الخطة العلاجية المعتمدة والمبنية على أسس تحليل السلوك التطبيقي (ABA) ومقاييس التطور اللغوي (Speech-Map).`;
      const goalsLine=data.achievedGoals?`من أبرز ما تحقق خلال هذه الفترة: ${data.achievedGoals}.`:"";
      const notesLine=data.notes?`ملاحظات الأخصائي/ة: ${data.notes}`:"";

      return [opener,body,goalsLine,notesLine,closing].filter(Boolean).join("\n\n");
    }
    function generateProgressReport(e,patientId){
      e.preventDefault();
      const f=formData(e);
      const patient=state.patients.find(x=>x.id===patientId);
      if(!patient)return;
      const staff=getCurrentPerson();
      const data={date:f.date,level:f.level,achievedGoals:f.achievedGoals,notes:f.notes};
      const summaryText=composeProgressReportText(patient,staff,data);
      state.progressReports.unshift({id:"pr-"+Date.now(),patientId,patientName:patient.name,date:data.date,level:data.level,achievedGoals:data.achievedGoals,notes:data.notes,summaryText,staffId:staff?staff.id:null,staffName:staff?staff.name:null,shared:!!f.shared});
      persist();closeModal();notify("تم توليد تقرير التقدم بنجاح");render();
    }

    function addAppointment(e){e.preventDefault();if(!can('editAppointments')){closeModal();notify("لا تملكين صلاحية حجز المواعيد");return}const f=formData(e);const conflict=findAppointmentConflict(f.date,f.time,f.clinician,f.room,null);if(conflict){notify(`⚠️ تعارض في الجدول: ${conflict.clinician===f.clinician?"المعالج/ة "+f.clinician:"الغرفة "+f.room} محجوز/ة بالفعل في نفس الموعد مع ${conflict.patient} — عدّلي الوقت أو الغرفة`);return}state.appointments.push({id:"apt-"+Date.now(),...f,status:"مجدول",newForStaff:true});persist();closeModal();notify("تم حجز الجلسة");render()}

    /* === تفاعلية إضافية: ميل ثلاثي الأبعاد للكروت + توهج يتبع المؤشر + تموّج عند الضغط ===
       تعمل بالتفويض (delegation) على document عشان تفضل شغالة حتى بعد كل render() اللي بيستبدل محتوى #app بالكامل. */
    (function initExtraInteractivity(){
      const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const canHover = window.matchMedia && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
      if(reduceMotion) return;

      if(canHover){
        let rafId=null, lastEvt=null;
        const clearTilt=()=>{document.querySelectorAll(".tilt-card, .portal-card").forEach(c=>{c.style.transform=""})};
        document.addEventListener("mousemove",(e)=>{
          lastEvt=e;
          if(rafId) return;
          rafId=requestAnimationFrame(()=>{
            rafId=null;
            const el=lastEvt.target.closest && lastEvt.target.closest(".tilt-card, .portal-card");
            document.querySelectorAll(".tilt-card, .portal-card").forEach(c=>{if(c!==el) c.style.transform=""});
            if(!el) return;
            const r=el.getBoundingClientRect();
            const px=(lastEvt.clientX-r.left)/r.width, py=(lastEvt.clientY-r.top)/r.height;
            const rx=(py-0.5)*-7, ry=(px-0.5)*7;
            el.style.transform=`perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
          });
        });
        document.addEventListener("mouseleave",clearTilt,true);
        window.addEventListener("blur",clearTilt);
      }

      document.addEventListener("mousemove",(e)=>{
        const hero=e.target.closest && e.target.closest(".hero-banner");
        if(!hero) return;
        const r=hero.getBoundingClientRect();
        hero.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");
        hero.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%");
      });

      document.addEventListener("click",(e)=>{
        const btn=e.target.closest && e.target.closest(".btn");
        if(!btn) return;
        const r=btn.getBoundingClientRect();
        const ripple=document.createElement("span");
        ripple.className="btn-ripple";
        const size=Math.max(r.width,r.height)*1.7;
        ripple.style.position="fixed";
        ripple.style.width=ripple.style.height=size+"px";
        ripple.style.left=(e.clientX-size/2)+"px";
        ripple.style.top=(e.clientY-size/2)+"px";
        ripple.style.zIndex="9999";
        const dark=btn.classList.contains("btn-primary")||btn.classList.contains("hero-btn-solid")||btn.classList.contains("btn-secondary");
        ripple.style.background=dark?"rgba(255,255,255,.45)":"rgba(23,66,61,.14)";
        document.body.appendChild(ripple);
        ripple.addEventListener("animationend",()=>ripple.remove());
      },true);
    })();

    (function initBackToTop(){
      const btn=document.createElement("button");
      btn.type="button";
      btn.className="back-to-top";
      btn.setAttribute("aria-label","العودة إلى أعلى الصفحة");
      btn.innerHTML=`<span style="display:flex;transform:rotate(180deg)">${ic("chevronDown",18)}</span>`;
      document.body.appendChild(btn);
      const reduceMotion=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let ticking=false;
      const onScroll=()=>{
        if(ticking) return;
        ticking=true;
        requestAnimationFrame(()=>{
          btn.classList.toggle("visible", window.scrollY>200);
          ticking=false;
        });
      };
      window.addEventListener("scroll",onScroll,{passive:true});
      btn.addEventListener("click",()=>{
        window.scrollTo({top:0,behavior:reduceMotion?"auto":"smooth"});
      });
      onScroll();
    })();

    function previewOrgLogo(input){
      const file=input.files&&input.files[0];if(!file)return;
      if(!file.type||file.type.indexOf("image/")!==0){notify("الرجاء اختيار ملف صورة");return}
      const snap=snapshotOrgForm(input);
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const size=160;
          const canvas=document.createElement("canvas");
          canvas.width=size;canvas.height=size;
          const ctx=canvas.getContext("2d");
          const scale=Math.max(size/img.width,size/img.height);
          const w=img.width*scale,h=img.height*scale;
          ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
          let dataUrl;
          try{dataUrl=canvas.toDataURL("image/jpeg",0.85)}catch(err){notify("تعذّر معالجة الصورة، جرّبي صورة تانية");return}
          state.orgProfileDraft=Object.assign({},state.orgProfileDraft,snap,{logo:dataUrl});
          persist();render();
        };
        img.onerror=()=>{notify("تعذّر تحميل الصورة، جرّبي صورة تانية")};
        img.src=reader.result;
      };
      reader.onerror=()=>{notify("تعذّر قراءة الملف")};
      reader.readAsDataURL(file);
    }

        img.onload=()=>{
          const size=160;
          const canvas=document.createElement("canvas");
          canvas.width=size;canvas.height=size;
          const ctx=canvas.getContext("2d");
          const scale=Math.max(size/img.width,size/img.height);
          const w=img.width*scale,h=img.height*scale;
          ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
          let dataUrl;
          try{dataUrl=canvas.toDataURL("image/jpeg",0.85)}catch(err){notify("تعذّر معالجة الصورة، جرّبي صورة تانية");return}
          state.orgProfileDraft=Object.assign({},state.orgProfileDraft,{logo:dataUrl});
          persist();
          const holder=document.getElementById("bizLogoPreview");
          if(holder) holder.innerHTML=`<img src="${dataUrl}" style="width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid var(--line)"><button type="button" class="btn btn-outline" style="width:auto;padding:6px 12px;font-size:11px" onclick="bizClearLogo()">إزالة الشعار</button>`;
        };
        img.onerror=()=>{notify("تعذّر تحميل الصورة، جرّبي صورة تانية")};
        img.src=reader.result;
      };
      reader.onerror=()=>{notify("تعذّر قراءة الملف")};
      reader.readAsDataURL(file);
    }
    function bizClearLogo(){
      state.orgProfileDraft=Object.assign({},state.orgProfileDraft,{logo:null});
      persist();
      const holder=document.getElementById("bizLogoPreview");
      if(holder) holder.innerHTML="";
    }
    function saveOrgProfile(e){
      e.preventDefault();
      try{
        if(!state.adminSession){notify("انتهت الجلسة، سجّلي الدخول تاني من فضلك");render();return}
        const f=formData(e);
        if(!f.orgName||!f.orgName.trim()){notify("من فضلك اكتبي اسم المؤسسة");return}
        let acc=state.adminAccounts.find(a=>a.username===state.adminSession.username);
        if(!acc){
          // self-heal: the session pointed at an account record that no
          // longer exists (e.g. state was reloaded from another tab) —
          // recreate it instead of crashing, so the save still goes through.
          acc={username:state.adminSession.username,password:"",ownerName:state.adminSession.ownerName,org:null};
          state.adminAccounts.push(acc);
        }
        const logo=(state.orgProfileDraft&&state.orgProfileDraft.logo!==undefined)?state.orgProfileDraft.logo:(acc.org?acc.org.logo:null);
        const id=(acc.org&&acc.org.id)||("org-"+Date.now());
        const code=(acc.org&&acc.org.code)||genOrgCode(f.orgName);
        const org={id,orgName:f.orgName,orgType:f.orgType,location:f.location,logo,code};
        acc.org=org;
        const existingIdx=state.facilities.findIndex(x=>x.id===id);
        const facEntry={id,type:f.orgType,icon:{"مركز":"briefcase","عيادة":"medical","مستشفى":"pulse","مدرسة":"school"}[f.orgType]||"briefcase",label:f.orgName,code,username:acc.username,password:acc.password||"1234",tagline:f.location?("في "+f.location):"مؤسسة شريكة",services:defaultServicesForType(f.orgType)};
        if(existingIdx>=0) state.facilities[existingIdx]=facEntry; else state.facilities.push(facEntry);
        state.featuredPartner={orgName:f.orgName,orgType:f.orgType,location:f.location,logo};
        state.orgProfileDraft=null;
        persist();
        notify("تم الحفظ — مؤسستك ظاهرة دلوقتي في الصفحة الرئيسية ✓");
        render();
      }catch(err){
        reportUnexpectedError(err);
      }
    }
  })();
  </script>
</body>
</html>
